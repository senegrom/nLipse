name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java 25
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Capture source revision for reproducible test diagnostics
        run: git archive --format=zip HEAD > /tmp/nlipse-source.zip

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, test and install application
        run: mvn --batch-mode --no-transfer-progress install

      - name: Verify Swing slider interactions
        run: >-
          xvfb-run -a mvn --batch-mode --no-transfer-progress
          -Djava.awt.headless=false -Dtest=PlotSliderInteractionIT test

      - name: Build benchmark harness
        run: mvn --batch-mode --no-transfer-progress -f benchmarks/pom.xml package

      - name: Smoke-test JMH harness
        run: >-
          java -jar benchmarks/target/benchmarks.jar
          -f 1 -wi 0 -i 1 -r 100ms -foe true
          'nlipse.math.FieldMathBenchmark.ordinaryEllipseBatch'

      - name: Check shell launchers
        run: sh -n scripts/aot-common.sh scripts/create-aot-cache.sh scripts/run-optimized.sh

      - name: Verify PowerShell AOT launcher
        shell: pwsh
        run: ./scripts/create-aot-cache.ps1

      - name: Verify AOT cache output
        run: |
          test -s target/nlipse.aot
          test -s target/nlipse.aot.meta
          . scripts/aot-common.sh
          aot_metadata_is_current target/nlipse.jar target/nlipse.aot.meta
          if aot_metadata_is_current pom.xml target/nlipse.aot.meta; then
            echo "Stale AOT metadata was accepted" >&2
            exit 1
          fi

      - name: Upload source and test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ github.sha }}
          retention-days: 7
          path: |
            /tmp/nlipse-source.zip
            target/surefire-reports/

  windows-smoke:
    name: Windows Java 25 smoke
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run platform-sensitive tests
        shell: pwsh
        run: >-
          mvn --batch-mode --no-transfer-progress
          "-Dtest=AtomicFilesTest,PlotConfigIOTest,MainTest" test

      - name: Create AOT cache with PowerShell launcher
        shell: pwsh
        run: ./scripts/create-aot-cache.ps1

      - name: Verify Windows AOT cache load
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath target/nlipse.aot)) {
            throw "AOT cache was not created"
          }
          if (-not (Test-Path -LiteralPath target/nlipse.aot.meta)) {
            throw "AOT metadata was not created"
          }
          $javaArguments = @(
            "-Djava.awt.headless=true",
            "-XX:+UseCompactObjectHeaders",
            "-XX:AOTCache=target/nlipse.aot",
            "-cp", "target/nlipse.jar",
            "nlipse.app.AotTrainer"
          )
          & java @javaArguments
          if ($LASTEXITCODE -ne 0) {
            throw "AOT smoke test exited with code $LASTEXITCODE"
          }
