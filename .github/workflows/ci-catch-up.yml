name: CI catch-up

# Pushes made with a workflow token never trigger push workflows, so commits
# published by automation can leave the main head without a CI run. This
# job dispatches ci.yml for such a head; dispatches are exempt from that
# restriction.
"on":
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  catch-up:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch CI when the main head has no run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          count=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$head&per_page=1" --jq .total_count)
          if [ "$count" = "0" ]; then
            gh workflow run ci.yml --repo "$REPOSITORY" --ref main
            echo "Dispatched CI for $head"
          else
            echo "CI already ran for $head"
          fi
