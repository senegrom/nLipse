name: JMH benchmark

"on":
  workflow_dispatch:
    inputs:
      include:
        description: JMH include regex
        required: false
        default: nlipse.math.FieldMathBenchmark.*
      forks:
        description: Fork count
        required: false
        default: '2'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build application and benchmark harness
        run: |
          mvn --batch-mode --no-transfer-progress -DskipTests install
          mvn --batch-mode --no-transfer-progress -f benchmarks/pom.xml package

      - name: Run benchmark
        run: >-
          java -jar benchmarks/target/benchmarks.jar
          -f '${{ inputs.forks }}'
          -wi 3 -w 500ms
          -i 5 -r 750ms
          -rf json -rff benchmark-results.json
          '${{ inputs.include }}'

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: benchmark-results.json
          retention-days: 30
