version: 2
updates:
  - package-ecosystem: maven
    directories:
      - /
      - /benchmarks
    schedule:
      interval: monthly
    groups:
      maven:
        patterns:
          - "*"
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
